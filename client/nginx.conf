server {
    listen 80;

    # Serve the built React app; fall back to index.html for client-side routing.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # REST API — client/src/api.js calls these as relative /api/... paths.
    location /api {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Socket.IO — client/src/socket.js connects same-origin in production
    # (import.meta.env.DEV is false), so this upgrade proxy is what makes
    # that actually reach the backend's WebSocket server.
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
